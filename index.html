<style>
:root{--o:#ff7a00;--bg:#0b0b1a;--dim:#8c8cb0;--red:#ff3b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:640px;padding:max(8px,env(safe-area-inset-top)) 8px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#top{display:flex;justify-content:space-between;align-items:center;font-size:8px;color:var(--dim);gap:8px}
#top button{font:inherit;font-size:8px;color:#fff;background:#1b1b3d;border:2px solid #fff;padding:5px 7px;cursor:pointer}
#stage{position:relative}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid var(--o);box-shadow:0 0 0 4px #000,0 0 26px #ff7a0055;touch-action:manipulation}
#stage::after{content:"";position:absolute;inset:4px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#hud{display:flex;gap:12px;font-size:8px}
.m{flex:1}.m b{display:block;margin-bottom:5px;color:var(--dim);font-weight:400}
.bar{height:12px;border:2px solid #fff;background:#111;display:flex;gap:1px;padding:1px}
.bar i{flex:1;background:#242436}.bar i.on{background:var(--o)}
#mh .bar i.on{background:var(--red)}
.pulse{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.7)}}
#dlg{border:4px solid #fff;background:#10102a;padding:12px 12px 22px;min-height:132px;position:relative;cursor:pointer;box-shadow:4px 4px 0 #000}
#who{display:inline-block;font-size:9px;padding:4px 7px;margin-bottom:9px;color:#000}
#txt{font-size:11px;line-height:1.85;min-height:64px;white-space:pre-wrap;word-break:break-word}
#txt.nar{color:#cfd0ff}
#nx{position:absolute;right:10px;bottom:6px;font-size:10px;animation:bl 1s steps(2) infinite;color:var(--o)}
@keyframes bl{50%{opacity:0}}
#ch{display:grid;gap:9px}
.btn{font:inherit;font-size:10px;line-height:1.7;text-align:left;color:#fff;background:#1b1b3d;border:4px solid #fff;padding:11px 12px;cursor:pointer;box-shadow:4px 4px 0 #000;touch-action:manipulation}
.btn:active,.btn:hover{background:var(--o);color:#000}
.btn small{display:block;color:var(--dim);font-size:8px;margin-top:5px;line-height:1.5}
.btn:active small,.btn:hover small{color:#000}
#ctl{display:none;grid-template-columns:1fr 1fr;gap:10px}
#ctl.on{display:grid}
#ctl.one{grid-template-columns:1fr}
#ctl .btn{text-align:center;font-size:18px;padding:18px}
#endcard{border:4px solid var(--o);background:#10102a;padding:14px;box-shadow:4px 4px 0 #000;display:flex;flex-direction:column;gap:10px}
#endcard .tag{font-size:8px;color:var(--dim)}
#etitle{margin:0;font-size:15px;line-height:1.5;color:var(--o)}
#eblurb{margin:0;font-size:10px;line-height:1.8}
#erank{font-size:10px;color:#ffd23f}
#estat,#epct{font-size:8px;color:var(--dim);line-height:1.8}
#endcard .row{display:grid;gap:9px}
#elist{font-size:8px;line-height:2;color:var(--dim)}
#elist .f{color:#fff}
#foot{font-size:7px;line-height:1.9;color:#5d5d80;text-align:center;padding:4px 6px}
.hide{display:none!important}

<body>
<div id="app">
  <div id="top"><span>REGAL BANDIT POPSTAR</span><span>ENDINGS <b id="ec">0/15</b> <button id="mute" aria-label="toggle sound">SND ON</button></span></div>
  <div id="stage"><canvas id="c" width="320" height="180"></canvas></div>
  <div id="hud">
    <div class="m" id="mc"><b>STREET CRED</b><div class="bar" id="bc"></div></div>
    <div class="m" id="mh"><b>HEAT</b><div class="bar" id="bh"></div></div>
  </div>

    <div class="tag">ENDING UNLOCKED &middot; <span id="ecount"></span></div>
    <h2 id="etitle"></h2>
    <p id="eblurb"></p>
    <div id="erank"></div>
    <div id="estat"></div>
    <div id="epct"></div>
    <div class="row">
      <button class="btn" id="again">&#9654; PLAY AGAIN (TRY ANOTHER ENDING)</button>
      <button class="btn" id="share">&#128242; CHALLENGE A FRIEND</button>
    </div>
    <div id="elist"></div>
  </div>
  <div id="foot">FICTION, FOR LAUGHS. NO PIEROGIES WERE HARMED. IN REAL LIFE DON'T DRINK AND DRIVE. CALL A LYFT. OR NONNA.</div>
</div>

<script>
(()=>{
'use strict';
/* =====================================================================
   REGAL BANDIT POPSTAR  -  an 8-bit Cleveland pull-over
   320x180 canvas, everything drawn with rectangles on purpose.
   ===================================================================== */
const W=320,H=180,HZ=104,LY=[125,147,169],CAR_X=44;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const A=(a,fn)=>{ctx.save();ctx.globalAlpha=a;fn();ctx.restore();};
function txt(s,x,y,c,size,align,shadow){size=size||8;ctx.font=size+'px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.textAlign=align||'left';
  if(shadow!==null){ctx.fillStyle=shadow||'#000';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);}ctx.fillStyle=c;ctx.fillText(s,Math.round(x),Math.round(y));}
function circle(cx,cy,r,c){for(let y=-r;y<=r;y++){const d=Math.floor(Math.sqrt(r*r-y*y));R(cx-d,cy+y,d*2,1,c);}}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const C={o:'#ff7a00',od:'#c25a00',skin:'#e8b48a',skind:'#cf9a74',hair:'#1b1109',jean:'#15151c',blk:'#0e0e14',wood:'#c0702a',woodd:'#5a2d0c',gold:'#ffd23f',red:'#ff3b3b'};

/* ---------------- AUDIO (tiny chiptune engine) ---------------- */
const Snd=(()=>{
  let ac=null,mg=null,muted=false,trk=null,st=0,nextT=0,tm=null,sirT=null;
  try{muted=localStorage.getItem('rbp_mute')==='1';}catch(e){}
  const f=n=>440*Math.pow(2,(n-69)/12);
  function init(){if(ac)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();mg=ac.createGain();mg.gain.value=muted?0:.22;mg.connect(ac.destination);}catch(e){ac=null;}}
  function resume(){try{if(ac&&ac.state==='suspended')ac.resume();}catch(e){}}
  function tone(fr,d,type,v,at,sl){if(!ac)return;try{const t=ac.currentTime+(at||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(fr,t);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,fr+sl),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);}catch(e){}}
  function noise(d,v,at){if(!ac)return;try{const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=v||.2;s.connect(g);g.connect(mg);s.start(ac.currentTime+(at||0));}catch(e){}}
  const T={
    title:{bpm:112,lead:[69,0,72,0,76,0,74,72,69,0,67,0,69,0,0,0],bass:[45,0,45,0,48,0,45,0,43,0,43,0,45,0,48,0],k:[0,4,8,12],h:[2,6,10,14]},
    drive:{bpm:150,lead:[69,0,72,0,76,0,72,0,74,0,72,0,69,0,67,0,69,0,72,0,76,0,79,0,77,0,76,0,72,0,69,0],bass:[45,0,45,0,45,0,48,0,43,0,43,0,43,0,46,0],k:[0,4,8,12],h:[1,3,5,7,9,11,13,15]},
    tense:{bpm:92,lead:[64,0,0,0,63,0,0,0,62,0,0,0,63,0,0,0],bass:[40,0,0,0,40,0,0,0,38,0,0,0,39,0,0,0],k:[0,8],h:[4,12]},
    chase:{bpm:182,lead:[69,72,76,72,69,72,76,81,67,71,74,71,67,71,74,79],bass:[45,45,0,45,43,43,0,43],k:[0,4,8,12],h:[2,6,10,14]},
    win:{bpm:132,lead:[72,76,79,76,72,76,79,84,83,79,76,79,83,0,84,0],bass:[48,0,48,0,55,0,55,0,53,0,53,0,55,0,55,0],k:[0,4,8,12],h:[2,6,10,14]},
    lose:{bpm:78,lead:[67,0,0,0,65,0,0,0,63,0,0,0,60,0,0,0],bass:[36,0,0,0,34,0,0,0,32,0,0,0,31,0,0,0],k:[0],h:[]}
  };
  function sched(){if(!ac||!trk)return;const t=T[trk];if(!t)return;if(!nextT||nextT<ac.currentTime)nextT=ac.currentTime+.05;
    while(nextT<ac.currentTime+.3){const sd=60/t.bpm/2,i=st%16,at=nextT-ac.currentTime;
      const l=t.lead[st%t.lead.length],b=t.bass[st%t.bass.length];
      if(l)tone(f(l),sd*.85,'square',.1,at);if(b)tone(f(b),sd*.95,'triangle',.22,at);
      if(t.k.indexOf(i)>=0)tone(110,.09,'sine',.3,at,-60);if(t.h.indexOf(i)>=0)noise(.03,.06,at);
      nextT+=sd;st++;}}
  return{
    init,resume,
    music(n){trk=n;st=0;nextT=0;if(!tm)tm=setInterval(sched,90);},
    blip(who){const m={COP:190,BANDIT:300,LUKEY:420,'TOM B':250,DAVE:350,JUDGE:150,RADIO:500,PHONE:700}[who]||260;tone(m+Math.random()*30,.04,'square',.05);},
    sel(){tone(660,.06,'square',.15);tone(990,.08,'square',.15,.06);},
    coin(){tone(988,.06,'square',.18);tone(1319,.14,'square',.18,.06);},
    hit(){noise(.18,.4);tone(160,.22,'sawtooth',.25,0,-110);},
    zap(){tone(300,.3,'sawtooth',.2,0,500);},
    siren(ms){clearInterval(sirT);if(!ac||!ms)return;let k=0;const end=Date.now()+ms;sirT=setInterval(()=>{if(Date.now()>end){clearInterval(sirT);return;}tone(k++%2?980:720,.32,'square',.07);},340);},
    toggle(){muted=!muted;try{localStorage.setItem('rbp_mute',muted?'1':'0');}catch(e){}if(mg)mg.gain.value=muted?0:.22;return muted;},
    get muted(){return muted;}
  };
})();

/* ---------------- STATE ---------------- */
const S={cred:0,heat:0,pk:0};
let scene={n:'title',p:{}},sceneT=0,trans=0,shake=0;
const floats=[],puffs=[],notes=[];
function meters(){
  const mk=(id,v)=>{const b=$(id);if(b.children.length!==10){b.innerHTML='<i></i>'.repeat(10);}for(let i=0;i<10;i++)b.children[i].className=i<v?'on':'';};
  mk('bc',S.cred);mk('bh',S.heat);
}
function pulse(id){const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse');}
function fx(o){if(!o)return;
  if(o.cred){S.cred=clamp(S.cred+o.cred,0,10);pulse('mc');floats.push({s:(o.cred>0?'+':'')+o.cred+' CRED',c:C.o,t:1.4});}
  if(o.heat){S.heat=clamp(S.heat+o.heat,0,10);pulse('mh');floats.push({s:(o.heat>0?'+':'')+o.heat+' HEAT',c:'#ff6b6b',t:1.4});}
  meters();}

/* ---------------- SPRITES ---------------- */
function pierogi(x,y){R(x+3,y,6,1,'#f6e7c1');R(x+1,y+1,10,1,'#f6e7c1');R(x,y+2,12,3,'#f6e7c1');R(x+1,y+5,10,1,'#e3cf9d');R(x+3,y+6,6,1,'#cdb67f');
  for(let i=0;i<5;i++)R(x+2+i*2,y+1,1,1,'#d9c08a');R(x+4,y+3,2,1,'#e8a317');R(x+7,y+3,1,1,'#e8a317');}
function hole(x,y){R(x+3,y,12,1,'#3a3a48');R(x+1,y+1,16,1,'#3a3a48');R(x,y+2,18,5,'#08080c');R(x+1,y+7,16,1,'#3a3a48');R(x+3,y+8,12,1,'#2d2d3a');R(x+4,y+3,3,1,'#16161e');}
function cone(x,y){R(x+4,y,4,2,C.o);R(x+3,y+2,6,3,C.o);R(x+3,y+3,6,1,'#fff');R(x+2,y+5,8,3,C.o);R(x,y+8,12,2,C.od);}
function barrel(x,y){R(x,y,11,13,C.o);R(x,y+3,11,2,'#fff');R(x,y+8,11,2,'#fff');R(x+1,y+13,9,1,C.od);}
function pick(x,y){R(x+2,y,6,1,C.gold);R(x+1,y+1,8,2,C.gold);R(x+2,y+3,6,1,C.gold);R(x+4,y+4,2,2,C.gold);R(x+3,y+1,1,1,'#fff');}
function flamingo(x,y,sw){R(x+1,y+7,5,5,'#ff7ab4');R(x+4+sw,y+1,1,7,'#ff7ab4');R(x+4+sw,y,3,2,'#ff7ab4');R(x+7+sw,y+1,2,1,'#222');R(x+2,y+12,1,7,'#ff9acb');R(x+5,y+12,1,7,'#ff9acb');}
function note(x,y,c){R(x,y,2,6,c);R(x-2,y+5,3,2,c);R(x+2,y,3,1,c);}
function smoke(x,y){puffs.push({x,y,vx:rnd(-6,-2),vy:rnd(-12,-6),l:rnd(.8,1.5),m:1.5});}
function drawPuffs(dt){for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.l-=dt;if(p.l<=0){puffs.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;A(clamp(p.l/p.m,0,1)*.6,()=>R(p.x,p.y,3,3,'#cfcfdf'));}}

function wheels(x,y,t,stopped){[x+7,x+39].forEach(wx=>{const wy=y+14;R(wx,wy+1,10,8,'#0a0a0f');R(wx+1,wy,8,10,'#0a0a0f');R(wx+3,wy+2,4,6,'#a0a0b6');
  const a=stopped?0:Math.floor(t*18)%4;if(a===0)R(wx+4,wy+3,2,4,'#555');else if(a===1)R(wx+3,wy+4,4,2,'#555');else if(a===2)R(wx+3,wy+3,1,4,'#555');else R(wx+6,wy+3,1,4,'#555');});}

/* The white Regal, facing right. y = top of sprite. The bandit is visible in the driver window. */
function drawCar(x,y,t,o){o=o||{};
  R(x+2,y+19,52,2,'rgba(0,0,0,.45)');
  R(x+11,y-6,2,10,C.wood);R(x+10,y-9,4,3,'#2a1a10');R(x+9,y-8,1,1,C.gold);   // guitar neck out the back
  R(x,y+9,56,8,'#f2f2f4');R(x+1,y+8,54,1,'#fff');R(x,y+15,56,3,'#b9b9c8');R(x+50,y+7,5,2,'#f2f2f4');R(x+55,y+10,1,5,'#d8d8e0');
  R(x+12,y+1,28,1,'#fff');R(x+10,y+2,32,7,'#f2f2f4');
  R(x+12,y+3,10,5,'#2b3b5c');R(x+25,y+3,12,5,'#2b3b5c');R(x+38,y+3,3,5,'#3a4f7c');
  // driver: head, orange headband, black bandit mask, cigarette, drink
  R(x+28,y+3,5,5,C.skin);R(x+27,y+3,6,1,C.hair);R(x+27,y+4,7,1,C.o);R(x+25,y+5+(Math.floor(t*6)%2),2,1,C.o);
  R(x+27,y+5,7,1,'#0a0a0a');R(x+28,y+5,1,1,'#fff');R(x+31,y+5,1,1,'#fff');R(x+34,y+7,4,1,'#fff');R(x+38,y+7,1,1,Math.floor(t*4)%4?'#ff3b1f':'#ffa040');
  const cup=Math.floor(t*.7)%3===0;R(x+23,cup?y+4:y+8,3,4,'#d8232a');R(x+23,cup?y+4:y+8,3,1,'#fff');
  R(x+24,y+8,6,2,C.skin);
  R(x+2,y+11,52,1,'#d0d0d8');R(x+22,y+12,6,1,C.o);R(x+1,y+13,6,2,'#c9c9d4');
  wheels(x,y,t,o.stopped);
  R(x+54,y+10,2,2,'#ffe58a');R(x,y+11,2,3,Math.floor(t*3)%7?'#ff2b2b':'#6a1010');
  if(!o.nolight){ctx.save();ctx.fillStyle='rgba(255,235,150,.13)';ctx.beginPath();ctx.moveTo(x+56,y+10);ctx.lineTo(x+120,y+1);ctx.lineTo(x+120,y+21);ctx.fill();ctx.restore();}
  if(!o.stopped&&Math.random()<.18)puffs.push({x:x-2,y:y+16,vx:rnd(-30,-18),vy:rnd(-6,-1),l:rnd(.5,.9),m:.9});
  if(Math.random()<.07)smoke(x+38,y+6);
}
function drawCopCar(x,y,t){const ph=Math.floor(t*6)%2;
  R(x+2,y+19,52,2,'rgba(0,0,0,.45)');R(x,y+9,56,8,'#1b2240');R(x+10,y+9,34,8,'#eceff6');R(x,y+15,56,3,'#10152b');
  R(x+10,y+2,32,7,'#1b2240');R(x+12,y+3,10,5,'#2b3b5c');R(x+25,y+3,12,5,'#2b3b5c');R(x+38,y+3,3,5,'#3a4f7c');
  R(x+18,y-2,9,3,ph?'#ff2b2b':'#7a1010');R(x+27,y-2,9,3,ph?'#1a2a7a':'#3b7bff');
  A(.28,()=>{R(x+12,y-7,12,11,ph?'#ff2b2b':'#000');R(x+30,y-7,12,11,ph?'#000':'#3b7bff');});
  R(x+16,y+11,8,2,'#1b2240');wheels(x,y,t,true);R(x+54,y+10,2,2,'#ffe58a');R(x,y+11,2,3,'#ff2b2b');}

/* The hero: Sicilian popstar. Orange headband, black bandit mask, orange shirt, black jeans,
   orange/black kicks, guitar on his back, smoke + a tall boy. (Sneakers have no logo - just stripes.) */
function drawHero(x,y,t,o){o=o||{};const s=o.s||1;ctx.save();if(s!==1){ctx.translate(x,y);ctx.scale(s,s);x=0;y=0;}
  const walk=o.walk?Math.floor(t*8)%2:0;
  for(let i=0;i<26;i++)R(x+17+i*.22,y+22-i,2,1,'#8b5a2b');
  R(x+21,y-7,5,6,'#2a1a10');R(x+20,y-6,1,1,C.gold);R(x+26,y-5,1,1,C.gold);

function nextLine(){if(li>=lines.length){const cb=afterTap;afterTap=null;lines=[];waiting=false;nxEl.classList.add('hide');if(cb)cb();return;}
  const l=lines[li++];showLine(l[0],l[1]);}
function showLine(who,text){clearInterval(typingT);full=text;pos=0;waiting=false;nxEl.classList.add('hide');dlg.classList.remove('hide');
  whoEl.textContent=who;whoEl.style.display=who?'inline-block':'none';whoEl.style.background=COL[who]||'#888';txtEl.textContent='';txtEl.className=who?'':'nar';
  typingT=setInterval(()=>{pos++;txtEl.textContent=full.slice(0,pos);if(pos%3===0)Snd.blip(who);if(pos>=full.length)lineDone();},22);}
function lineDone(){clearInterval(typingT);txtEl.textContent=full;pos=full.length;waiting=true;
  if(li>=lines.length&&afterLast){const lc=afterLast;afterLast=null;lines=[];waiting=false;lc();}else nxEl.classList.remove('hide');}
function advance(){if(scene.n==='drive'||scene.n==='lie')return;if(choosing)return;if(!lines.length&&!waiting)return;
  if(!waiting){lineDone();return;}waiting=false;nextLine();}

function showChoices(list){chEl.innerHTML='';choosing=true;
  list.forEach((c,i)=>{const b=document.createElement('button');b.className='btn';b.innerHTML='<span>'+(i+1)+'. '+esc(c.t)+'</span>'+(c.s?'<small>'+esc(c.s)+'</small>':'');
    b.addEventListener('click',()=>{if(!choosing)return;choosing=false;Snd.init();Snd.resume();Snd.sel();chEl.innerHTML='';fx(c.fx);go(c.go);});chEl.appendChild(b);});}

function go(id){const n=N[id];if(!n){console.error('missing node',id);return;}
  chEl.innerHTML='';choosing=false;fx(n.fx);
  if(n.sc)setScene(n.sc,n.sp);
  if(n.mus)Snd.music(n.mus);
  if(n.sfx&&Snd[n.sfx])Snd[n.sfx]();
  const say=n.say||[];
  const next=()=>{
    if(n.mini==='drive')startDrive('drive',()=>go(n.pass));
    else if(n.mini==='chase')startDrive('chase',ok=>go(ok?n.pass:n.fail));
    else if(n.mini==='lie')startLie(ok=>go(ok?n.pass:n.fail));
    else if(n.end)showEnding(n.end);
    else if(n.branch)go(n.branch());
    else if(n.next)go(n.next);};
  if(n.ch)playLines(say,null,()=>showChoices(n.ch));else playLines(say,next,null);}

/* ---------------- ENDINGS, STATS, SHARING ---------------- */
function getFound(){try{return JSON.parse(localStorage.getItem('rbp_found')||'[]');}catch(e){return[];}}
function setFound(a){try{localStorage.setItem('rbp_found',JSON.stringify(a));}catch(e){}}
async function api(path,opt){try{if(typeof fetch!=='function')return null;const r=await fetch(path,opt);if(!r.ok)return null;return await r.json();}catch(e){return null;}}
function updateCount(){const n=Object.keys(E).length;$('ec').textContent=getFound().length+'/'+n;}
let lastEnding=null;
function showEnding(id){const e=E[id];lastEnding=id;const found=getFound();if(found.indexOf(id)<0){found.push(id);setFound(found);}
  Snd.siren(0);Snd.music(e.good?'win':'lose');dlg.classList.add('hide');chEl.innerHTML='';hideCtl();
  $('etitle').textContent=e.t;$('eblurb').textContent=e.b;
  const rk=e.s>=90?"THE LAND'S OWN LEGEND":e.s>=70?'EAST SIDE ROYALTY':e.s>=45?'BLOCK FAMOUS':e.s>=25?'LOCAL PIEROGI HAZARD':'BOTTOM OF LAKE ERIE';
  $('erank').textContent='RANK: '+rk;$('estat').textContent='CRED '+S.cred+'/10  HEAT '+S.heat+'/10  PIEROGIES '+S.pk;
  $('epct').textContent='';$('ecount').textContent=found.length+'/'+Object.keys(E).length+' FOUND';
  $('elist').innerHTML=Object.keys(E).map(k=>found.indexOf(k)>=0?'<span class="f">&#9733; '+esc(E[k].t)+'</span>':'&#9734; ???').join('<br>');
  $('endcard').classList.remove('hide');updateCount();
  try{$('endcard').scrollIntoView({behavior:'smooth',block:'nearest'});}catch(x){}
  api('/api/ending',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).then(s=>{
    if(s&&s.total>=3&&s.counts&&s.counts[id]){$('epct').textContent=Math.round(100*s.counts[id]/s.total)+'% OF '+s.total+' PLAYERS GOT THIS ENDING';}});}
function share(){const e=lastEnding?E[lastEnding].t:'REGAL BANDIT POPSTAR';
  const text='I got pulled over as REGAL BANDIT POPSTAR and got the "'+e+'" ending. Snitch on Lukey or blame Tom B? Beat it:';
  const url=location.href.split('#')[0];
  if(navigator.share){navigator.share({title:'REGAL BANDIT POPSTAR',text,url}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text+' '+url).then(()=>{$('share').textContent='COPIED! PASTE IT IN THE GROUP CHAT';}).catch(()=>{});}}

function boot(){S.cred=0;S.heat=0;S.pk=0;meters();updateCount();$('endcard').classList.add('hide');dlg.classList.add('hide');hideCtl();lines=[];waiting=false;afterTap=null;afterLast=null;clearInterval(typingT);
  setScene('title');Snd.music('title');
  showChoices([{t:'▶ PRESS START',s:'SOUND ON. TURN IT UP.',go:'start'}]);}

/* ---------------- INPUT ---------------- */
cv.addEventListener('pointerdown',e=>{
  if(scene.n==='drive'){const r=cv.getBoundingClientRect();laneMove((e.clientY-r.top)<r.height/2?-1:1);}
  else if(scene.n==='lie')lieTap();else advance();});
dlg.addEventListener('click',advance);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w'){laneMove(-1);e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='s'){laneMove(1);e.preventDefault();}
  else if(e.key===' '||e.key==='Enter'){if(scene.n==='lie'){lieTap();e.preventDefault();}else if(!choosing){advance();e.preventDefault();}}
  else if(/^[1-9]$/.test(e.key)&&choosing){const b=chEl.children[+e.key-1];if(b)b.click();}});
$('again').addEventListener('click',()=>{Snd.init();Snd.resume();boot();window.scrollTo({top:0,behavior:'smooth'});});
$('share').addEventListener('click',share);
$('mute').addEventListener('click',()=>{Snd.init();Snd.resume();$('mute').textContent=Snd.toggle()?'SND OFF':'SND ON';});
$('mute').textContent=Snd.muted?'SND OFF':'SND ON';

/* ---------------- MAIN LOOP ---------------- */
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;sceneT+=dt;
  ctx.save();ctx.clearRect(0,0,W,H);
  if(shake>0){shake-=dt;ctx.translate(Math.round(rnd(-2,2)),Math.round(rnd(-2,2)));}
  const fn=scene.n==='drive'?sceneDrive:scene.n==='lie'?sceneLie:(SC[scene.n]||SC.night);
  fn(dt,sceneT,scene.p||{});
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt;if(f.t<=0){floats.splice(i,1);continue;}txt(f.s,W-6,22+(1.4-f.t)*-10+10+i*10,f.c,8,'right');}
  if(trans>0){trans-=dt;A(clamp(trans/.35,0,1),()=>R(0,0,W,H,'#000'));}
  ctx.restore();requestAnimationFrame(loop);}
window.RBP={N,E,S,go,setScene,SC,boot,showEnding,fx,D,L,startDrive,startLie,get scene(){return scene;},sceneT:()=>sceneT};
meters();boot();requestAnimationFrame(loop);
})();
</script>
