<style>
:root{--o:#ff7a00;--bg:#07071a;--dim:#8c8cb0;--red:#ff3b3b;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#05050f;color:#fff;font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:0 0 auto;width:min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)),calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9));width:min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)),calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9));font-size:calc(var(--u,1.2px) * 6)}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.4) 100%);z-index:3}
#tb{opacity:.45;transition:opacity .2s}#tb:hover,#tb:focus-within,#tb:active{opacity:1}
#tb{position:absolute;top:calc(var(--u,1.2px) * 2);right:calc(var(--u,1.2px) * 2);display:flex;gap:calc(var(--u,1.2px) * 2);z-index:6}
.sm{font:inherit;font-size:max(6px,calc(var(--u,1.2px) * 4.2));color:#fff;background:rgba(11,11,26,.5);border:2px solid rgba(255,255,255,.5);padding:.6em .7em;cursor:pointer;touch-action:manipulation;line-height:1}
.sm:active{background:var(--o);color:#000}
#panel{position:absolute;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(5,5,15,.95);padding:calc(var(--u,1.2px) * 12) calc(var(--u,1.2px) * 8) calc(var(--u,1.2px) * 8);font-size:max(7px,calc(var(--u,1.2px) * 4.6));line-height:1.7;display:flex;flex-direction:column;gap:1.1em}
#panel.idle{display:none}
.btn{font:inherit;font-size:1em;line-height:1.7;text-align:center;color:#fff;background:#1b1b3d;border:3px solid #fff;padding:.8em;cursor:pointer;box-shadow:3px 3px 0 #000;touch-action:manipulation;width:100%}
.btn:active{background:var(--o);color:#000}
@media (hover:hover){.btn:hover{background:var(--o);color:#000}}
.btn:disabled{opacity:.5}
#endcard{border:3px solid var(--o);background:#10102a;padding:1em;box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;gap:.9em}
#endcard .tag{font-size:.8em;color:var(--dim)}
#etitle{margin:0;font-size:1.6em;line-height:1.4;color:var(--o)}
#eblurb{margin:0;line-height:1.8}
#erank{color:var(--gold)}
#estat,#epct{font-size:.8em;color:var(--dim);line-height:1.8}

#endcard .row{display:grid;gap:.7em}
.nm{display:flex;gap:.6em}

#lb{border:3px solid var(--gold);background:#10102a;padding:1em;box-shadow:3px 3px 0 #000}

#lbmode{font-size:.75em;line-height:1.8;color:var(--dim);margin-bottom:.8em}
.lbrow{display:grid;grid-template-columns:3.4em 1fr auto;gap:.6em;line-height:1.6;padding:.5em 0;border-bottom:1px dashed #2a2a50}

<body>
<div id="app">
  <div id="stage"><canvas id="c" width="320" height="180"></canvas>
    <div id="tb"><button class="sm" id="lbtn">BOARD</button><button class="sm" id="full">FULL</button><button class="sm" id="mute">SND ON</button></div>
    <div id="panel" class="idle">
      <div id="endcard" class="hide">
        <div class="tag">ENDING UNLOCKED &middot; <span id="ecount"></span></div>
        <h2 id="etitle"></h2>
        <p id="eblurb"></p>
        <div id="erank"></div>
        <div id="esc"></div>
        <div id="estat"></div>
        <div id="epct"></div>
        <div class="nm"><input id="nm" maxlength="12" placeholder="YOUR NAME" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn" id="sub">SUBMIT SCORE</button></div>
        <div id="subres"></div>
        <div class="row">
          <button class="btn hide" id="bossbtn">&#9654; FINAL BOSS: nAna</button>
          <button class="btn" id="again">&#9654; PLAY AGAIN (TRY ANOTHER ENDING)</button>

      <div id="lb" class="hide"></div>

    </div>
  </div>
  <div id="gone"><b id="ec">0/18</b><div id="hint" class="hide"></div><div id="dlg" class="hide"><span id="who"></span><div id="txt"></div><span id="nx" class="hide"></span></div><div id="ch"></div></div>
</div>

<script>
(()=>{
'use strict';
/* =====================================================================
   REGAL BANDIT POPSTAR  -  an 8-bit Cleveland pull-over
   320x180 canvas, everything drawn with rectangles on purpose.
   ===================================================================== */
const W=320,H=180,HZ=104,LY=[125,147,169],CAR_X=44;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const A=(a,fn)=>{ctx.save();ctx.globalAlpha=a;fn();ctx.restore();};
function txt(s,x,y,c,size,align,shadow){size=size||8;ctx.font=size+'px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.textAlign=align||'left';
  if(shadow!==null){ctx.fillStyle=shadow||'#000';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);}ctx.fillStyle=c;ctx.fillText(s,Math.round(x),Math.round(y));}
function circle(cx,cy,r,c){for(let y=-r;y<=r;y++){const d=Math.floor(Math.sqrt(r*r-y*y));R(cx-d,cy+y,d*2,1,c);}}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const C={o:'#ff7a00',od:'#c25a00',skin:'#e8b48a',skind:'#cf9a74',hair:'#1b1109',jean:'#15151c',blk:'#0e0e14',wood:'#c0702a',woodd:'#5a2d0c',gold:'#ffd23f',red:'#ff3b3b'};

/* ---------------- AUDIO (tiny chiptune engine) ---------------- */
const Snd=(()=>{
  let ac=null,mg=null,muted=false,trk=null,st=0,nextT=0,tm=null,sirT=null;
  try{muted=localStorage.getItem('rbp_mute')==='1';}catch(e){}
  const f=n=>440*Math.pow(2,(n-69)/12);
  function init(){if(ac)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();mg=ac.createGain();mg.gain.value=muted?0:.22;mg.connect(ac.destination);}catch(e){ac=null;}}
  function resume(){try{if(ac&&ac.state==='suspended')ac.resume();}catch(e){}}
  function tone(fr,d,type,v,at,sl){if(!ac)return;try{const t=ac.currentTime+(at||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(fr,t);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,fr+sl),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);}catch(e){}}
  function noise(d,v,at){if(!ac)return;try{const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=v||.2;s.connect(g);g.connect(mg);s.start(ac.currentTime+(at||0));}catch(e){}}
  const T={
    title:{bpm:112,lead:[69,0,72,0,76,0,74,72,69,0,67,0,69,0,0,0],bass:[45,0,45,0,48,0,45,0,43,0,43,0,45,0,48,0],k:[0,4,8,12],h:[2,6,10,14]},
    drive:{bpm:150,lead:[69,0,72,0,76,0,72,0,74,0,72,0,69,0,67,0,69,0,72,0,76,0,79,0,77,0,76,0,72,0,69,0],bass:[45,0,45,0,45,0,48,0,43,0,43,0,43,0,46,0],k:[0,4,8,12],h:[1,3,5,7,9,11,13,15]},
    tense:{bpm:92,lead:[64,0,0,0,63,0,0,0,62,0,0,0,63,0,0,0],bass:[40,0,0,0,40,0,0,0,38,0,0,0,39,0,0,0],k:[0,8],h:[4,12]},
    chase:{bpm:182,lead:[69,72,76,72,69,72,76,81,67,71,74,71,67,71,74,79],bass:[45,45,0,45,43,43,0,43],k:[0,4,8,12],h:[2,6,10,14]},
    win:{bpm:132,lead:[72,76,79,76,72,76,79,84,83,79,76,79,83,0,84,0],bass:[48,0,48,0,55,0,55,0,53,0,53,0,55,0,55,0],k:[0,4,8,12],h:[2,6,10,14]},
    lose:{bpm:78,lead:[67,0,0,0,65,0,0,0,63,0,0,0,60,0,0,0],bass:[36,0,0,0,34,0,0,0,32,0,0,0,31,0,0,0],k:[0],h:[]},
    boss:{bpm:168,lead:[64,0,64,67,0,64,0,69,68,0,68,71,0,68,0,73],bass:[40,40,0,40,43,43,0,43,38,38,0,38,41,41,0,41],k:[0,3,4,8,11,12],h:[2,6,10,14]}
  };
  function sched(){if(!ac||!trk)return;const t=T[trk];if(!t)return;if(!nextT||nextT<ac.currentTime)nextT=ac.currentTime+.05;
    while(nextT<ac.currentTime+.3){const sd=60/t.bpm/2,i=st%16,at=nextT-ac.currentTime;
      const l=t.lead[st%t.lead.length],b=t.bass[st%t.bass.length];
      if(l)tone(f(l),sd*.85,'square',.1,at);if(b)tone(f(b),sd*.95,'triangle',.22,at);
      if(t.k.indexOf(i)>=0)tone(110,.09,'sine',.3,at,-60);if(t.h.indexOf(i)>=0)noise(.03,.06,at);
      nextT+=sd;st++;}}
  return{
    init,resume,tone,noise,
    music(n){trk=n;st=0;nextT=0;if(!tm)tm=setInterval(sched,90);},
    blip(who){const m={COP:190,BANDIT:300,LUKEY:420,'TOM B':250,DAVE:350,JUDGE:150,RADIO:500,PHONE:700,NANA:230}[who]||260;tone(m+Math.random()*30,.04,'square',.05);},
    sel(){tone(660,.06,'square',.15);tone(990,.08,'square',.15,.06);},
    coin(){tone(988,.06,'square',.18);tone(1319,.14,'square',.18,.06);},
    toss(){tone(520,.12,'square',.14,0,-320);},
    heal(){tone(660,.07,'square',.15);tone(880,.07,'square',.15,.07);tone(1175,.14,'square',.15,.14);},
    hit(){noise(.18,.4);tone(160,.22,'sawtooth',.25,0,-110);},
    zap(){tone(300,.3,'sawtooth',.2,0,500);},
    siren(ms){clearInterval(sirT);if(!ac||!ms)return;let k=0;const end=Date.now()+ms;sirT=setInterval(()=>{if(Date.now()>end){clearInterval(sirT);return;}tone(k++%2?980:720,.32,'square',.07);},340);},
    toggle(){muted=!muted;try{localStorage.setItem('rbp_mute',muted?'1':'0');}catch(e){}if(mg)mg.gain.value=muted?0:.22;return muted;},
    get muted(){return muted;}
  };
})();

/* ---------------- STATE ---------------- */
const S={cred:0,heat:0,pk:0,snitches:0};
let scene={n:'title',p:{}},sceneT=0,trans=0,shake=0;
const floats=[],puffs=[],notes=[];
let hudPulse={c:0,h:0};
function meters(){}
function pulse(id){if(id==='mc')hudPulse.c=.5;else hudPulse.h=.5;}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function fx(o){if(!o)return;
  if(o.cred){S.cred=clamp(S.cred+o.cred,0,10);pulse('mc');floats.push({s:(o.cred>0?'+':'')+o.cred+' CRED',c:C.o,t:1.4});}
  if(o.heat){S.heat=clamp(S.heat+o.heat,0,10);pulse('mh');floats.push({s:(o.heat>0?'+':'')+o.heat+' HEAT',c:'#ff6b6b',t:1.4});if(o.heat>0)buzz(40);}
  if(o.snitch){S.snitches=(S.snitches||0)+1;floats.push({s:'SNITCHED ON LUKEY',c:'#e0b84c',t:1.8});}
}

/* ---------------- SPRITES ---------------- */
function pierogi(x,y){R(x+3,y,6,1,'#f6e7c1');R(x+1,y+1,10,1,'#f6e7c1');R(x,y+2,12,3,'#f6e7c1');R(x+1,y+5,10,1,'#e3cf9d');R(x+3,y+6,6,1,'#cdb67f');
  for(let i=0;i<5;i++)R(x+2+i*2,y+1,1,1,'#d9c08a');R(x+4,y+3,2,1,'#e8a317');R(x+7,y+3,1,1,'#e8a317');}
function hole(x,y){R(x+3,y,12,1,'#3a3a48');R(x+1,y+1,16,1,'#3a3a48');R(x,y+2,18,5,'#08080c');R(x+1,y+7,16,1,'#3a3a48');R(x+3,y+8,12,1,'#2d2d3a');R(x+4,y+3,3,1,'#16161e');}
function cone(x,y){R(x+4,y,4,2,C.o);R(x+3,y+2,6,3,C.o);R(x+3,y+3,6,1,'#fff');R(x+2,y+5,8,3,C.o);R(x,y+8,12,2,C.od);}
function barrel(x,y){R(x,y,11,13,C.o);R(x,y+3,11,2,'#fff');R(x,y+8,11,2,'#fff');R(x+1,y+13,9,1,C.od);}
function pick(x,y){R(x+2,y,6,1,C.gold);R(x+1,y+1,8,2,C.gold);R(x+2,y+3,6,1,C.gold);R(x+4,y+4,2,2,C.gold);R(x+3,y+1,1,1,'#fff');}
function flamingo(x,y,sw){R(x+1,y+7,5,5,'#ff7ab4');R(x+4+sw,y+1,1,7,'#ff7ab4');R(x+4+sw,y,3,2,'#ff7ab4');R(x+7+sw,y+1,2,1,'#222');R(x+2,y+12,1,7,'#ff9acb');R(x+5,y+12,1,7,'#ff9acb');}
function note(x,y,c){R(x,y,2,6,c);R(x-2,y+5,3,2,c);R(x+2,y,3,1,c);}
function smoke(x,y){puffs.push({x,y,vx:rnd(-6,-2),vy:rnd(-12,-6),l:rnd(.8,1.5),m:1.5});}
function drawPuffs(dt){for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.l-=dt;if(p.l<=0){puffs.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;A(clamp(p.l/p.m,0,1)*.6,()=>R(p.x,p.y,3,3,'#cfcfdf'));}}

function wheels(x,y,t,stopped){[x+7,x+39].forEach(wx=>{const wy=y+14;R(wx,wy+1,10,8,'#0a0a0f');R(wx+1,wy,8,10,'#0a0a0f');R(wx+3,wy+2,4,6,'#a0a0b6');
  const a=stopped?0:Math.floor(t*18)%4;if(a===0)R(wx+4,wy+3,2,4,'#555');else if(a===1)R(wx+3,wy+4,4,2,'#555');else if(a===2)R(wx+3,wy+3,1,4,'#555');else R(wx+6,wy+3,1,4,'#555');});}

/* The white Regal, facing right. y = top of sprite. The bandit is visible in the driver window. */
function drawCar(x,y,t,o){o=o||{};
  R(x+2,y+19,52,2,'rgba(0,0,0,.45)');
  if(!o.empty){R(x+11,y-6,2,10,C.wood);R(x+10,y-9,4,3,'#2a1a10');R(x+9,y-8,1,1,C.gold);}   // guitar neck out the back
  R(x,y+9,56,8,'#f2f2f4');R(x+1,y+8,54,1,'#fff');R(x,y+15,56,3,'#b9b9c8');R(x+50,y+7,5,2,'#f2f2f4');R(x+55,y+10,1,5,'#d8d8e0');
  R(x+12,y+1,28,1,'#fff');R(x+10,y+2,32,7,'#f2f2f4');
  R(x+12,y+3,10,5,'#2b3b5c');R(x+25,y+3,12,5,'#2b3b5c');R(x+38,y+3,3,5,'#3a4f7c');
  // driver: head, orange headband, black bandit mask, cigarette, drink
  if(!o.empty){R(x+28,y+3,5,5,C.skin);R(x+27,y+3,6,1,C.hair);R(x+27,y+4,7,1,C.o);R(x+25,y+5+(Math.floor(t*6)%2),2,1,C.o);
  R(x+27,y+5,7,1,'#0a0a0a');R(x+28,y+5,1,1,'#fff');R(x+31,y+5,1,1,'#fff');R(x+34,y+7,4,1,'#fff');R(x+38,y+7,1,1,Math.floor(t*4)%4?'#ff3b1f':'#ffa040');
  const cup=Math.floor(t*.7)%3===0;R(x+23,cup?y+4:y+8,3,4,'#d8232a');R(x+23,cup?y+4:y+8,3,1,'#fff');
  R(x+24,y+8,6,2,C.skin);}
  R(x+2,y+11,52,1,'#d0d0d8');R(x+22,y+12,6,1,C.o);R(x+1,y+13,6,2,'#c9c9d4');
  wheels(x,y,t,o.stopped);

function sceneBoss(dt,t){

  const ph=B.phase;
  B.t+=dt;B.tCd=Math.max(0,B.tCd-dt);B.inv=Math.max(0,B.inv-dt);B.flash=Math.max(0,B.flash-dt);B.mt=Math.max(0,B.mt-dt);B.sayT=Math.max(0,B.sayT-dt);
  B.py+=(LY[B.lane]-B.py)*Math.min(1,dt*16);B.by+=(LY[B.bossLane]-B.by)*Math.min(1,dt*9);

  if(B.eject>0){B.eject-=dt;if(B.eject<=0)bossPhase2();}

  if(playing){
    B.stun=Math.max(0,B.stun-dt);
    B.shield=Math.max(0,B.shield-dt);if(B.stun>0)B.shield=0;else{B.tShield-=dt;if(B.tShield<=0){B.shield=.9;B.tShield=rnd(2.2,3.4);}}
    if(B.stun<=0){B.tNag-=dt;if(B.tNag<=0){bossNag();B.tNag=ph===1?rnd(1.1,1.7):rnd(.75,1.2);}}
    if(ph===2&&B.stun<=0){B.tMove-=dt;if(B.tMove<=0){const o=[0,1,2].filter(l=>l!==B.bossLane);B.bossLane=o[Math.floor(Math.random()*2)];B.tMove=rnd(1.3,2);B.decor.forEach(d=>{if(d.lane===B.bossLane&&Math.abs(d.x-NX)<50){d.up=false;d.x+=rnd(-16,16);}});}}
    B.tItem-=dt;if(B.tItem<=0){bossItem();B.tItem=rnd(1.2,2);}
    B.shots.forEach(s=>{if(s.warn>0)s.warn-=dt;else s.x+=s.vx*dt;
      if(s.warn<=0&&!s.dead&&s.lane===B.lane&&s.x<BX+24&&s.x+14>BX&&B.inv<=0){s.dead=true;bossHurt();}});
    B.shots=B.shots.filter(s=>!s.dead&&s.x>-20);
    B.items.forEach(i=>{i.x-=70*dt;if(!i.dead&&i.lane===B.lane&&i.x<BX+26&&i.x+10>BX-2){i.dead=true;bossPick(i);}});
    B.items=B.items.filter(i=>!i.dead&&i.x>-12);
    B.cs.forEach(c=>{c.x+=c.vx*dt;c.r+=dt*14;
      if(!c.dead&&!B.fin&&B.eject<=0&&c.x+6>=(ph===1?CARX+10:NX+4)&&c.lane===(ph===1?1:B.bossLane)){c.dead=true;if(B.shield>0){B.msg='BLOCKED!';B.mt=.7;Snd.hit();}else bossDamage();}});
    B.cs=B.cs.filter(c=>!c.dead&&c.x<W+10);
  }
  const pos=bossStage(t,B);
  for(let l=0;l<3;l++){

    if(B.lane===l&&!(B.inv>0&&Math.floor(t*18)%2))drawHero(BX,B.py-46,t,{walk:true});
  }
  drawPuffs(dt);
  // speech bubble above nAna
  if(B.sayT>0&&B.eject<=0)bubble(B.say,pos.nx+13,Math.max(30,pos.ny-26));

  if(B.stun>0)txt('DISTRACTED: DOUBLE DAMAGE',W/2,16,C.gold,8,'center');
  else if(B.mt>0)txt(B.msg,W/2,16,'#fff',8,'center');

const dlg=$('dlg'),whoEl=$('who'),txtEl=$('txt'),nxEl=$('nx'),chEl=$('ch'),hintEl=$('hint');
let CH=[],CHB=[],hintT=0;
function setScene(n,p){scene={n,p:p||{}};sceneT=0;trans=.35;if(n!=='pull'&&n!=='drive')Snd.siren(0);if(n!=='drive'&&n!=='lie')hideCtl();}
let ctlMode=null,BTN=[];const BF={};
function hint(t){if(!t){hintEl.classList.add('hide');hintT=0;return;}hintEl.textContent=t;hintEl.classList.remove('hide');hintT=6;dlg.classList.add('hide');}
function hideCtl(){ctlMode=null;BTN=[];hint('');}
function showCtl(k){ctlMode=k;hint(k==='tap'?'TAP THE BUTTON ON THE SCREEN WHEN THE NEEDLE HITS GREEN. KEEP A STRAIGHT FACE.':k==='boss'?'ARROWS = MOVE. CAN = THROW. PHONE = BLAME LUKEY. GRAB LEAVES + SMOKES TO HEAL.':'SWIPE UP/DOWN OR TAP THE ARROWS TO CHANGE LANES. PIEROGIES = CRED.');}

let lines=[],li=0,typingT=null,full='',pos=0,waiting=false,afterTap=null,afterLast=null,choosing=false;
function playLines(arr,tapCb,lastCb){lines=arr.slice();li=0;afterTap=tapCb;afterLast=lastCb;if(!lines.length){finishAll();return;}nextLine();}
function finishAll(){const lc=afterLast;afterLast=null;if(lc){lc();return;}}
function nextLine(){if(li>=lines.length){const cb=afterTap;afterTap=null;lines=[];waiting=false;nxEl.classList.add('hide');if(cb)cb();return;}
  const l=lines[li++];showLine(l[0],l[1]);}
function showLine(who,text){clearInterval(typingT);full=text;pos=0;waiting=false;nxEl.classList.add('hide');dlg.classList.remove('hide');hintEl.classList.add('hide');
  whoEl.textContent=who;whoEl.style.display=who?'inline-block':'none';whoEl.style.background=COL[who]||'#888';txtEl.textContent='';txtEl.className=who?'':'nar';
  typingT=setInterval(()=>{pos++;txtEl.textContent=full.slice(0,pos);if(pos%3===0)Snd.blip(who);if(pos>=full.length)lineDone();},22);}
function lineDone(){clearInterval(typingT);txtEl.textContent=full;pos=full.length;waiting=true;
  if(li>=lines.length&&afterLast){const lc=afterLast;afterLast=null;lines=[];waiting=false;lc();}else nxEl.classList.remove('hide');}
function advance(){if(scene.n==='drive'||scene.n==='lie')return;if(choosing)return;if(!lines.length&&!waiting)return;
  if(!waiting){lineDone();return;}waiting=false;nextLine();}

function pick(i){const c=CH[i];if(!c||!choosing)return;Snd.init();Snd.resume();Snd.sel();buzz(10);
  if(c.fn){c.fn();return;}choosing=false;CH=[];CHB=[];fx(c.fx);if(c.go==='start'||c.go==='boss0')autoFull();go(c.go);}
function showChoices(list){CH=list.slice();choosing=true;}

function go(id){const n=N[id];if(!n){console.error('missing node',id);return;}
  CH=[];CHB=[];choosing=false;fx(n.fx);
  if(n.sc)setScene(n.sc,n.sp);
  if(n.mus)Snd.music(n.mus);
  if(n.sfx&&Snd[n.sfx])Snd[n.sfx]();
  const say=n.say||[];
  const next=()=>{
    if(n.mini==='drive')startDrive('drive',()=>go(n.pass));
    else if(n.mini==='chase')startDrive('chase',ok=>go(ok?n.pass:n.fail));
    else if(n.mini==='lie')startLie(ok=>go(ok?n.pass:n.fail));
    else if(n.mini==='boss')startBoss(ok=>go(ok?n.pass:n.fail));
    else if(n.end)showEnding(n.end);
    else if(n.branch)go(n.branch());
    else if(n.next)go(n.next);};
  if(n.ch)playLines(say,null,()=>showChoices(n.ch));else playLines(say,next,null);}

  const r=await fetch(API_BASE+path,Object.assign({signal:ctl.signal},opt||{}));clearTimeout(to);
  let j=null;try{j=await r.json();}catch(e){}

function calcScore(id,s){const e=E[id];if(!e)return 0;return e.s+clamp(s.cred,0,10)*10+clamp(s.pk,0,80)*5+(10-clamp(s.heat,0,10))*3+clamp(s.snitches||0,0,9)*2;}

  const r=await api('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,ending:run.id,cred:run.cred,heat:run.heat,pk:run.pk,snitches:run.snitches})});

const ptr=new Map();
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();Snd.resume();const p=cpos(e);
  const cb=CHB.find(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h);
  if(cb){BF['ch'+cb.i]=.18;ptr.set(e.pointerId,{btn:1});pick(cb.i);return;}
  const b=BTN.find(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h);
  if(b){BF[b.id]=.18;buzz(8);ptr.set(e.pointerId,{btn:1});b.act();return;}
  ptr.set(e.pointerId,{x:p.x,y:p.y});});
cv.addEventListener('pointerup',e=>{const s0=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(!s0||s0.btn)return;const p=cpos(e),dy=p.y-s0.y;
  if(scene.n==='drive'||scene.n==='boss')laneMove(Math.abs(dy)>12?(dy<0?-1:1):(p.y<H/2?-1:1));

document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='ArrowUp'||e.key==='w'){laneMove(-1);e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='s'){laneMove(1);e.preventDefault();}

  else if(e.key==='f'||e.key==='F'){$('full').click();}
  
  else if(/^[1-9]$/.test(e.key)&&choosing){pick(+e.key-1);}});

function drawCtl(dt,t){

}

/* ---------------- DIALOGUE + CHOICES, DRAWN IN THE GAME ---------------- */
const WR={};
function wrap(t,n){const k=n+'|'+t;if(WR[k])return WR[k];const out=[];let cur='';
  t.split(' ').forEach(w=>{while(w.length>n){if(cur){out.push(cur);cur='';}out.push(w.slice(0,n));w=w.slice(n);}
    if(!cur)cur=w;else if((cur+' '+w).length<=n)cur+=' '+w;else{out.push(cur);cur=w;}});
  if(cur)out.push(cur);return WR[k]=out;}
function frame(x,y,w,h,col,a){A(a,()=>R(x,y,w,h,'#0a0a1e'));R(x,y,w,2,col);R(x,y+h-2,w,2,col);R(x,y,2,h,col);R(x+w-2,y,2,h,col);}
function drawDlg(t){
  if(dlg.classList.contains('hide')||CH.length)return;
  const who=whoEl.textContent,col=COL[who]||'#888',lines=wrap(full,36),h=14+lines.length*11+(who?8:0);
  const x=6,w=W-12,y=H-6-h;
  frame(x,y,w,h,'#fff',.9);
  if(who){const tw=who.length*8+8;R(x,y-9,tw,10,col);txt(who,x+4,y-8,'#000',8,'left',null);}
